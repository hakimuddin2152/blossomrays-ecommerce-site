[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Stripe webhook requires raw body — disable body parsing for this route
[[headers]]
  for = "/api/stripe/webhook"
  [headers.values]
    Content-Type = "application/json"
