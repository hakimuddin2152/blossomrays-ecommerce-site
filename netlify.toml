[build]
  command = "node scripts/set-env.js && npm run build"
  publish = "dist/blossomrays/browser"
  functions = "netlify/functions"

# Local development — run these two commands separately instead of netlify dev:
#   Terminal 1: npm run dev:local   (Angular on :3000 with proxy to functions)
#   Terminal 2: netlify functions:serve --port 9999
#   Terminal 3: stripe listen --forward-to http://localhost:3000/.netlify/functions/stripe-webhook
#   Browser:    http://localhost:3000
[dev]
  command = "npm run dev:local"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--registry https://registry.npmjs.org/ --legacy-peer-deps"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

# SPA fallback — all routes served by index.html (Angular handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect old Next.js API paths to Netlify Functions
[[redirects]]
  from = "/api/stripe/checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.googletagmanager.com; frame-src https://js.stripe.com; connect-src 'self' https://*.supabase.co https://api.stripe.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: blob: https://*.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"

